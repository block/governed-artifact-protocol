name: Documentation

# Builds the Docusaurus site in documentation/ on every change that affects
# it, and deploys the result to GitHub Pages when main changes. The site is
# published at https://block.github.io/governed-artifact-protocol/.
#
# Deployment requires GitHub Pages to be enabled for the repository with
# "GitHub Actions" as the source (Settings → Pages → Build and deployment).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "documentation/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DEFERRED.md"
      - "specification/**"
      - "demo/src/**"
      - "demo/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "documentation/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DEFERRED.md"
      - "specification/**"
      - "demo/src/**"
      - "demo/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        run: pnpm docs:test && pnpm --dir documentation typecheck

      # Reads the Pages configuration so the site is built with the right
      # origin and base path (a project site is served from /<repo>/).
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        working-directory: documentation
        env:
          GAP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GAP_REPO_BRANCH: ${{ github.event.repository.default_branch }}
          DOCS_URL: ${{ steps.pages.outputs.origin || 'http://localhost:3000' }}
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
